<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#eef7f1"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#9a6b3f" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#f0dcc6" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <text x="600" y="95" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#b45309" letter-spacing="3">2026 부모급여 한눈에</text>

  <!-- 지급액 카드 두 개 -->
  <g filter="url(#sh)">
    <rect x="150" y="175" width="420" height="220" rx="20" fill="#ffffff"/>
    <rect x="630" y="175" width="420" height="220" rx="20" fill="#ffffff"/>
  </g>
  <text x="360" y="235" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#64748b">만 0세 (0～11개월)</text>
  <text x="360" y="320" text-anchor="middle" font-family="sans-serif" font-size="60" font-weight="800" fill="#1e293b">월 100만 원</text>
  <text x="360" y="365" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94a3b8">가정양육 기준 현금 지급</text>

  <text x="840" y="235" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#64748b">만 1세 (12～23개월)</text>
  <text x="840" y="320" text-anchor="middle" font-family="sans-serif" font-size="60" font-weight="800" fill="#1e293b">월 50만 원</text>
  <text x="840" y="365" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94a3b8">가정양육 기준 현금 지급</text>

  <!-- 핵심 3칩 -->
  <g font-family="sans-serif" font-size="18" font-weight="600">
    <rect x="150" y="520" width="285" height="60" rx="30" fill="#fde68a" opacity="0.7"/>
    <text x="292" y="558" text-anchor="middle" fill="#92400e">소득·재산 기준 없음</text>
    <rect x="457" y="520" width="285" height="60" rx="30" fill="#bbf7d0" opacity="0.7"/>
    <text x="600" y="558" text-anchor="middle" fill="#166534">어린이집 차액은 현금</text>
    <rect x="765" y="520" width="285" height="60" rx="30" fill="#fecaca" opacity="0.7"/>
    <text x="907" y="558" text-anchor="middle" fill="#991b1b">출생 60일 이내 신청</text>
  </g>
</svg>
