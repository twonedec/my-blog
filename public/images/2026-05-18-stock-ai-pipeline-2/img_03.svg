<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%" style="background-color: #FAFBFC; font-family: 'Pretendard', -apple-system, sans-serif;">
  <!-- Title -->
  <text x="425" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1D2939">생산 환경 파이프라인 결함 원인 분석(RCA) 및 경화 매트릭스</text>
  
  <!-- Table Header Background -->
  <rect x="40" y="80" width="770" height="40" rx="4" fill="#1D2939"/>
  <text x="60" y="105" font-size="13" font-weight="700" fill="#FFFFFF">시스템 레이어</text>
  <text x="260" y="105" font-size="13" font-weight="700" fill="#FFFFFF">식별된 결함 및 원인 분석 (RCA)</text>
  <text x="560" y="105" font-size="13" font-weight="700" fill="#FFFFFF">적용된 안정화 솔루션 (Hardening)</text>

  <!-- ROW 1: LLM Compute & Auth -->
  <g transform="translate(0, 135)">
    <!-- Background Card -->
    <rect x="40" y="0" width="770" height="110" rx="6" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="110" fill="#F04438" rx="4"/>
    
    <!-- Column 1: Layer -->
    <text x="60" y="45" font-size="13" font-weight="700" fill="#344054">LLM Compute &amp;</text>
    <text x="60" y="65" font-size="13" font-weight="700" fill="#344054">Ingress Auth</text>
    <text x="60" y="85" font-size="11" fill="#98A2B3">engine.py</text>
    
    <!-- Column 2: Defect / RCA -->
    <rect x="250" y="20" width="280" height="70" rx="4" fill="#FEF3F2"/>
    <text x="260" y="42" font-size="12" font-weight="600" fill="#B42318">트러블슈팅 1: Sonnet 단일 배치 비용 오버헤드</text>
    <text x="260" y="62" font-size="12" font-weight="600" fill="#B42318">트러블슈팅 2: .env 로더 누락으로 401 에러</text>
    
    <!-- Column 3: Solution -->
    <rect x="550" y="20" width="245" height="70" rx="4" fill="#F0F9FF"/>
    <text x="560" y="42" font-size="12" font-weight="600" fill="#0269A1">컴퓨팅 자원 계층화 (Gemini 릴리즈 배치)</text>
    <text x="560" y="62" font-size="12" font-weight="600" fill="#0269A1">공통 Configuration 인스턴스 단일화</text>
  </g>

  <!-- ROW 2: Lifecycle & Idempotency -->
  <g transform="translate(0, 260)">
    <!-- Background Card -->
    <rect x="40" y="0" width="770" height="110" rx="6" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="110" fill="#F04438" rx="4"/>
    
    <!-- Column 1: Layer -->
    <text x="60" y="45" font-size="13" font-weight="700" fill="#344054">Pipeline Lifecycle</text>
    <text x="60" y="65" font-size="13" font-weight="700" fill="#344054">&amp; Idempotency</text>
    <text x="60" y="85" font-size="11" fill="#98A2B3">scheduler / Brave API</text>
    
    <!-- Column 2: Defect / RCA -->
    <rect x="250" y="20" width="280" height="70" rx="4" fill="#FEF3F2"/>
    <text x="260" y="42" font-size="12" font-weight="600" fill="#B42318">트러블슈팅 3: 구문 오류로 파이프라인 다운</text>
    <text x="260" y="62" font-size="12" font-weight="600" fill="#B42318">RCA: 멱등성 결여로 재실행 시 쿼리 중복 소모</text>
    
    <!-- Column 3: Solution -->
    <rect x="550" y="20" width="245" height="70" rx="4" fill="#F0F9FF"/>
    <text x="560" y="42" font-size="12" font-weight="600" fill="#0269A1">f-string 리터럴 이중 중괄호 이스케이프</text>
    <text x="560" y="62" font-size="12" font-weight="600" fill="#0269A1">데이터 수집 레이어 상태 캐싱 인터셉터</text>
  </g>

  <!-- ROW 3: Ingestion & Schema Protocols -->
  <g transform="translate(0, 385)">
    <!-- Background Card -->
    <rect x="40" y="0" width="770" height="110" rx="6" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
    <rect x="40" y="0" width="4" height="110" fill="#F04438" rx="4"/>
    
    <!-- Column 1: Layer -->
    <text x="60" y="45" font-size="13" font-weight="700" fill="#344054">Ingestion &amp;</text>
    <text x="60" y="65" font-size="13" font-weight="700" fill="#344054">Schema Protocols</text>
    <text x="60" y="85" font-size="11" fill="#98A2B3">recommender.py / KIS API</text>
    
    <!-- Column 2: Defect / RCA -->
    <rect x="250" y="20" width="280" height="70" rx="4" fill="#FEF3F2"/>
    <text x="260" y="42" font-size="12" font-weight="600" fill="#B42318">트러블슈팅 4: yfinance 비공식 세션 만료 현상</text>
    <text x="260" y="62" font-size="12" font-weight="600" fill="#B42318">트러블슈팅 5: KIS API 주말 휴장 시간 None 반환</text>
    
    <!-- Column 3: Solution -->
    <rect x="550" y="20" width="245" height="70" rx="4" fill="#F0F9FF"/>
    <text x="560" y="42" font-size="12" font-weight="600" fill="#0269A1">금융투자협회 표준 KIS 공식 오픈 API 이관</text>
    <text x="560" y="62" font-size="12" font-weight="600" fill="#0269A1">응답 스키마 널 가드(Null Guard) 분기 추가</text>
  </g>

  <!-- Bottom Architecture Status Note -->
  <rect x="40" y="510" width="770" height="25" rx="4" fill="#F2F4F7"/>
  <text x="425" y="527" text-anchor="middle" font-size="11" font-weight="600" fill="#667085">Target Architecture Operational Status: Hardened • Fixed Cost Calibrated at ~$6.5/mo</text>
</svg>
