<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ff"/>
      <stop offset="100%" style="stop-color:#e8f4f0"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 격자 -->
  <g stroke="#d1e3f8" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- 차트 영역 채움 -->
  <polygon points="120,420 180,390 240,400 300,360 360,340 420,310 480,290 540,260 600,240 660,220 720,200 780,210 840,180 900,160 960,150 1020,130 1080,120 1080,520 120,520" fill="url(#chartGrad)"/>

  <!-- MA5 라인 (파란색) -->
  <polyline points="120,420 180,390 240,400 300,360 360,340 420,310 480,290 540,260 600,240 660,220 720,200 780,210 840,180 900,160 960,150 1020,130 1080,120"
    fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- MA20 라인 (회색) -->
  <polyline points="120,450 180,440 240,430 300,420 360,400 420,380 480,360 540,340 600,320 660,300 720,280 780,270 840,250 900,235 960,220 1020,205 1080,190"
    fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,4"/>

  <!-- 골든크로스 포인트 (MA5가 MA20 위로) -->
  <circle cx="480" cy="290" r="12" fill="white" stroke="#22c55e" stroke-width="3"/>
  <text x="480" y="295" text-anchor="middle" font-family="monospace" font-size="11" fill="#22c55e" font-weight="bold">✓</text>

  <!-- 거래량 바 -->
  <g opacity="0.5">
    <rect x="130" y="490" width="14" height="25" fill="#94a3b8" rx="2"/>
    <rect x="190" y="480" width="14" height="35" fill="#94a3b8" rx="2"/>
    <rect x="250" y="485" width="14" height="30" fill="#94a3b8" rx="2"/>
    <rect x="310" y="475" width="14" height="40" fill="#3b82f6" rx="2"/>
    <rect x="370" y="470" width="14" height="45" fill="#3b82f6" rx="2"/>
    <rect x="430" y="460" width="14" height="55" fill="#22c55e" rx="2"/>
    <rect x="490" y="455" width="14" height="60" fill="#22c55e" rx="2"/>
    <rect x="550" y="468" width="14" height="47" fill="#3b82f6" rx="2"/>
    <rect x="610" y="472" width="14" height="43" fill="#3b82f6" rx="2"/>
    <rect x="670" y="465" width="14" height="50" fill="#22c55e" rx="2"/>
    <rect x="730" y="458" width="14" height="57" fill="#22c55e" rx="2"/>
    <rect x="790" y="470" width="14" height="45" fill="#3b82f6" rx="2"/>
    <rect x="850" y="462" width="14" height="53" fill="#22c55e" rx="2"/>
    <rect x="910" y="455" width="14" height="60" fill="#22c55e" rx="2"/>
    <rect x="970" y="448" width="14" height="67" fill="#22c55e" rx="2"/>
    <rect x="1030" y="440" width="14" height="75" fill="#3b82f6" rx="2"/>
  </g>

  <!-- 신호 태그들 -->
  <rect x="800" y="80" width="130" height="28" rx="14" fill="#22c55e" opacity="0.9"/>
  <text x="865" y="99" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="600">골든크로스 ↑</text>

  <rect x="950" y="80" width="130" height="28" rx="14" fill="#3b82f6" opacity="0.9"/>
  <text x="1015" y="99" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="600">거래량 급증 ↑</text>

  <!-- 종목 스캔 카운터 -->
  <rect x="60" y="50" width="220" height="50" rx="12" fill="white" opacity="0.85"/>
  <text x="80" y="72" font-family="sans-serif" font-size="12" fill="#64748b">전종목 스캔</text>
  <text x="80" y="90" font-family="monospace" font-size="18" fill="#1e40af" font-weight="700">3,000 → 25</text>

  <!-- 메인 텍스트 -->
  <text x="600" y="570" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1e3a5f" font-weight="700" letter-spacing="-0.5">퀀트 신호 감지 시스템</text>
  <text x="600" y="605" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">3,000개 종목에서 상위 25개를 추려내는 설계</text>
</svg>
