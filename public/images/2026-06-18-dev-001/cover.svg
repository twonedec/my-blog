<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ff"/>
      <stop offset="100%" style="stop-color:#eef7f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#d1e3f8" stroke-width="1" opacity="0.5">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- 두 개의 깔때기 -->
  <g font-family="sans-serif" text-anchor="middle">
    <!-- 성장주 깔때기 -->
    <text x="340" y="120" font-size="16" fill="#2563eb" font-weight="700">성장주 스크리너</text>
    <polygon points="180,150 500,150 430,330 250,330" fill="#3b82f6" opacity="0.12"/>
    <polygon points="180,150 500,150 430,330 250,330" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="340" y="178" font-family="monospace" font-size="15" fill="#1e40af">3,000개</text>
    <line x1="222" y1="200" x2="458" y2="200" stroke="#93c5fd" stroke-width="1"/>
    <text x="340" y="222" font-size="12" fill="#475569">G1 흑자·시총 → G2 성장성</text>
    <line x1="248" y1="248" x2="432" y2="248" stroke="#93c5fd" stroke-width="1"/>
    <text x="340" y="270" font-size="12" fill="#475569">G3 밸류 → G4 진입</text>
    <line x1="275" y1="296" x2="405" y2="296" stroke="#93c5fd" stroke-width="1"/>
    <text x="340" y="318" font-family="monospace" font-size="15" fill="#16a34a" font-weight="700">AI → 2–7개</text>

    <!-- 저평가주 깔때기 -->
    <text x="860" y="120" font-size="16" fill="#0f766e" font-weight="700">저평가주 스크리너</text>
    <polygon points="700,150 1020,150 950,330 770,330" fill="#14b8a6" opacity="0.12"/>
    <polygon points="700,150 1020,150 950,330 770,330" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <text x="860" y="178" font-family="monospace" font-size="15" fill="#0f766e">3,000개</text>
    <line x1="742" y1="200" x2="978" y2="200" stroke="#5eead4" stroke-width="1"/>
    <text x="860" y="222" font-size="12" fill="#475569">V1 재무안정 → V2 저평가</text>
    <line x1="768" y1="248" x2="952" y2="248" stroke="#5eead4" stroke-width="1"/>
    <text x="860" y="270" font-size="12" fill="#475569">PBR≤1 · PER≤12 · ROE≥8%</text>
    <line x1="795" y1="296" x2="925" y2="296" stroke="#5eead4" stroke-width="1"/>
    <text x="860" y="318" font-family="monospace" font-size="15" fill="#0f766e" font-weight="700">AI → 3–10개</text>
  </g>

  <!-- 라벨 -->
  <g font-family="sans-serif">
    <rect x="430" y="380" width="340" height="40" rx="10" fill="#fef9c3" opacity="0.85"/>
    <text x="600" y="406" text-anchor="middle" font-size="14" fill="#854d0e" font-weight="600">재무제표로 거르고 · AI로 가치함정 탐지</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#1e3a5f" font-weight="700" letter-spacing="-0.5">성장주·저평가주 스크리너</text>
  <text x="600" y="598" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">3,000개 종목을 재무 지표로 거르는 설계 — 시리즈 6편</text>
</svg>
