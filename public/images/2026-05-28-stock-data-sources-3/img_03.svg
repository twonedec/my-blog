<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" fill="url(#bg3)" rx="16"/>
  <rect width="800" height="380" fill="none" rx="16" stroke="#334155" stroke-width="1"/>

  <!-- title -->
  <text x="400" y="44" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">VISUALIZATION — 중복 제거 효과</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#f1f5f9">수집 건수 vs 실제 분석 건수</text>
  <text x="400" y="98" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" fill="#64748b">5개 소스 병렬 수집 후 URL 해시 + 코사인 유사도 중복 제거</text>
  <line x1="40" y1="116" x2="760" y2="116" stroke="#334155" stroke-width="1"/>

  <!-- day1: 5월 12일 -->
  <!-- collected: 217, used: 106 -->
  <text x="200" y="160" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">5월 12일</text>

  <!-- 수집 bar -->
  <text x="90" y="195" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">수집</text>
  <rect x="100" y="178" width="217" height="26" rx="6" fill="rgba(14,165,233,0.2)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
  <text x="325" y="196" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8"> 217건</text>

  <!-- 실사용 bar -->
  <text x="90" y="235" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">실사용</text>
  <rect x="100" y="218" width="106" height="26" rx="6" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
  <text x="214" y="236" font-family="monospace" font-size="14" font-weight="700" fill="#34d399"> 106건 (49%)</text>

  <!-- removed annotation -->
  <text x="100" y="265" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#ef4444">111건 중복 제거 →</text>

  <!-- divider -->
  <line x1="400" y1="140" x2="400" y2="300" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- day2: 5월 13일 -->
  <text x="600" y="160" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">5월 13일</text>

  <text x="490" y="195" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">수집</text>
  <rect x="500" y="178" width="183" height="26" rx="6" fill="rgba(14,165,233,0.2)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
  <text x="691" y="196" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8"> 183건</text>

  <text x="490" y="235" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">실사용</text>
  <rect x="500" y="218" width="105" height="26" rx="6" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
  <text x="613" y="236" font-family="monospace" font-size="14" font-weight="700" fill="#34d399"> 105건 (57%)</text>

  <text x="500" y="265" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#ef4444">78건 중복 제거 →</text>

  <!-- footer box -->
  <rect x="50" y="296" width="700" height="56" rx="12" fill="rgba(255,255,255,0.03)" stroke="#334155" stroke-width="1"/>
  <text x="70" y="318" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">1단계: URL 해시</text>
  <text x="70" y="338" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#64748b">완전히 동일한 URL은 DB 저장 자체 차단</text>
  <line x1="290" y1="306" x2="290" y2="344" stroke="#334155" stroke-width="1"/>
  <text x="310" y="318" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">2단계: 코사인 유사도</text>
  <text x="310" y="338" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#64748b">제목 유사도 0.45 이상이면 같은 기사로 판단</text>
  <line x1="600" y1="306" x2="600" y2="344" stroke="#334155" stroke-width="1"/>
  <text x="616" y="318" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#10b981">결과</text>
  <text x="616" y="338" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#6ee7b7">수집 대비 약 절반만 실제 분석</text>
</svg>
