<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff"/>
      <stop offset="100%" style="stop-color:#eef5f0"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="card">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 배경 격자 -->
  <g stroke="#e2eaf5" stroke-width="1" opacity="0.7">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="650" y1="0" x2="650" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- 소스 카드들 (왼쪽) -->
  <!-- KIS API -->
  <rect x="40" y="100" width="220" height="70" rx="14" fill="white" filter="url(#card)"/>
  <rect x="40" y="100" width="6" height="70" rx="3" fill="#3b82f6"/>
  <text x="60" y="128" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="600">한국투자증권 API</text>
  <text x="60" y="152" font-family="sans-serif" font-size="12" fill="#94a3b8">주가 · 수급 · 목표주가</text>

  <!-- 구글 RSS -->
  <rect x="40" y="195" width="220" height="70" rx="14" fill="white" filter="url(#card)"/>
  <rect x="40" y="195" width="6" height="70" rx="3" fill="#f59e0b"/>
  <text x="60" y="223" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="600">Google RSS</text>
  <text x="60" y="247" font-family="sans-serif" font-size="12" fill="#94a3b8">뉴스 · 대량 수집</text>

  <!-- 네이버 금융 -->
  <rect x="40" y="290" width="220" height="70" rx="14" fill="white" filter="url(#card)"/>
  <rect x="40" y="290" width="6" height="70" rx="3" fill="#22c55e"/>
  <text x="60" y="318" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="600">네이버 금융 뉴스</text>
  <text x="60" y="342" font-family="sans-serif" font-size="12" fill="#94a3b8">종목별 알짜 뉴스</text>

  <!-- 증권사 뉴스 -->
  <rect x="40" y="385" width="220" height="70" rx="14" fill="white" filter="url(#card)"/>
  <rect x="40" y="385" width="6" height="70" rx="3" fill="#8b5cf6"/>
  <text x="60" y="413" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="600">증권사 공식 뉴스</text>
  <text x="60" y="437" font-family="sans-serif" font-size="12" fill="#94a3b8">전문 투자 정보</text>

  <!-- DART -->
  <rect x="40" y="480" width="220" height="70" rx="14" fill="white" filter="url(#card)"/>
  <rect x="40" y="480" width="6" height="70" rx="3" fill="#ef4444"/>
  <text x="60" y="508" font-family="sans-serif" font-size="13" fill="#64748b" font-weight="600">DART 전자공시</text>
  <text x="60" y="532" font-family="sans-serif" font-size="12" fill="#94a3b8">실적 · 수주 · 팩트</text>

  <!-- 화살표들 -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="6,3">
    <line x1="260" y1="135" x2="480" y2="280"/>
    <line x1="260" y1="230" x2="480" y2="295"/>
    <line x1="260" y1="325" x2="480" y2="315"/>
    <line x1="260" y1="420" x2="480" y2="335"/>
    <line x1="260" y1="515" x2="480" y2="355"/>
  </g>
  <!-- 화살촉 -->
  <g fill="#cbd5e1">
    <polygon points="480,275 470,268 470,282"/>
    <polygon points="480,290 470,283 470,297"/>
    <polygon points="480,310 470,303 470,317"/>
    <polygon points="480,330 470,323 470,337"/>
    <polygon points="480,350 470,343 470,357"/>
  </g>

  <!-- 중앙 처리 박스 -->
  <rect x="480" y="240" width="240" height="150" rx="20" fill="url(#centerGrad)" filter="url(#card)"/>
  <text x="600" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" font-weight="700">데이터 수집 엔진</text>
  <text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">중복 제거 · 유사도 필터</text>
  <text x="600" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">예외 처리 · 정규화</text>
  <text x="600" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">월 운영비 ≈ 커피 한 잔 ☕</text>

  <!-- 오른쪽 화살표 -->
  <line x1="720" y1="315" x2="820" y2="315" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="820,315 810,308 810,322" fill="#cbd5e1"/>

  <!-- 출력 카드 -->
  <rect x="820" y="240" width="200" height="150" rx="16" fill="white" filter="url(#card)"/>
  <rect x="820" y="240" width="200" height="6" rx="3" fill="url(#centerGrad)"/>
  <text x="920" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e293b" font-weight="700">AI 분석 엔진</text>
  <text x="920" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">뉴스 감성 분석</text>
  <text x="920" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">공시 팩트 검증</text>
  <text x="920" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">종목 판단 리포트</text>
  <text x="920" y="375" text-anchor="middle" font-family="sans-serif" font-size="20">📊</text>

  <!-- 하단 제목 -->
  <text x="600" y="570" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1e3a5f" font-weight="700">주식 자동화 데이터 소스 조합</text>
  <text x="600" y="605" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#64748b">돌고 돌아 정착한 주가 · 뉴스 · 공시 최적 구성</text>
</svg>
