<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbf0"/>
      <stop offset="100%" style="stop-color:#f0f7ff"/>
    </linearGradient>
    <filter id="card2">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- 격자 -->
  <g stroke="#e8e8e8" stroke-width="1" opacity="0.6">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- 타임라인 선 -->
  <line x1="100" y1="315" x2="1100" y2="315" stroke="#e2e8f0" stroke-width="3"/>

  <!-- STEP 1: 오픈소스 라이브러리 -->
  <circle cx="220" cy="315" r="18" fill="#f59e0b"/>
  <text x="220" y="321" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="700">1</text>

  <rect x="100" y="140" width="240" height="130" rx="16" fill="white" filter="url(#card2)"/>
  <rect x="100" y="140" width="240" height="5" rx="2" fill="#f59e0b"/>
  <text x="220" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#78350f" font-weight="700">해외 오픈소스 라이브러리</text>
  <text x="220" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e">처음엔 편했다</text>
  <line x1="120" y1="208" x2="320" y2="208" stroke="#fde68a" stroke-width="1"/>
  <text x="130" y="226" font-family="sans-serif" font-size="11" fill="#b45309">❌ 업데이트 느림</text>
  <text x="130" y="244" font-family="sans-serif" font-size="11" fill="#b45309">❌ 빈 데이터 반환</text>
  <text x="130" y="262" font-family="sans-serif" font-size="11" fill="#b45309">❌ 서버 불안정</text>
  <!-- 아래 화살표 -->
  <line x1="220" y1="333" x2="220" y2="370" stroke="#e2e8f0" stroke-width="2"/>

  <!-- STEP 2: 국내 파싱 -->
  <circle cx="500" cy="315" r="18" fill="#8b5cf6"/>
  <text x="500" y="321" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="700">2</text>

  <rect x="380" y="380" width="240" height="130" rx="16" fill="white" filter="url(#card2)"/>
  <rect x="380" y="380" width="240" height="5" rx="2" fill="#8b5cf6"/>
  <text x="500" y="412" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4c1d95" font-weight="700">국내 사이트 스크래핑</text>
  <text x="500" y="433" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">대안 찾아 국내로</text>
  <line x1="400" y1="447" x2="600" y2="447" stroke="#ddd6fe" stroke-width="1"/>
  <text x="410" y="465" font-family="sans-serif" font-size="11" fill="#7c3aed">❌ 사이트 구조 변경 시 뻗음</text>
  <text x="410" y="483" font-family="sans-serif" font-size="11" fill="#7c3aed">❌ 실시간 데이터 약함</text>
  <text x="410" y="501" font-family="sans-serif" font-size="11" fill="#7c3aed">❌ 주말 버그 🐛</text>
  <line x1="500" y1="297" x2="500" y2="260" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 주말 버그 말풍선 -->
  <rect x="540" y="200" width="200" height="70" rx="12" fill="#fef3c7" filter="url(#card2)"/>
  <polygon points="555,270 545,285 565,270" fill="#fef3c7"/>
  <text x="640" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e" font-weight="600">😱 주말 버그 발견!</text>
  <text x="640" y="248" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">장 없는 날 None 값 전송</text>
  <text x="640" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">평일엔 절대 못 잡는 함정</text>

  <!-- STEP 3: KIS API 정착 -->
  <circle cx="880" cy="315" r="22" fill="#22c55e"/>
  <text x="880" y="321" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="700">✓</text>

  <rect x="760" y="140" width="240" height="140" rx="16" fill="white" filter="url(#card2)"/>
  <rect x="760" y="140" width="240" height="5" rx="2" fill="#22c55e"/>
  <text x="880" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#14532d" font-weight="700">한국투자증권 공식 API</text>
  <text x="880" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">돌고 돌아 정착</text>
  <line x1="780" y1="207" x2="980" y2="207" stroke="#bbf7d0" stroke-width="1"/>
  <text x="790" y="225" font-family="sans-serif" font-size="11" fill="#166534">✅ 증권사 메인 서버 직통</text>
  <text x="790" y="243" font-family="sans-serif" font-size="11" fill="#166534">✅ 수급·목표주가 무료</text>
  <text x="790" y="261" font-family="sans-serif" font-size="11" fill="#166534">✅ 안정적 · 정확</text>
  <text x="790" y="279" font-family="sans-serif" font-size="11" fill="#166534">✅ 예외 없음</text>
  <line x1="880" y1="333" x2="880" y2="370" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 하단 레이블 -->
  <text x="220" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">1단계</text>
  <text x="500" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">2단계</text>
  <text x="880" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="600">최종 정착</text>

  <!-- 하단 텍스트 -->
  <text x="600" y="568" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1e3a5f" font-weight="700">주가 데이터 소스 변천사</text>
  <text x="600" y="602" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">오픈소스 삽질 → 스크래핑 → 공식 API 정착까지</text>
</svg>
