<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ff"/>
      <stop offset="100%" style="stop-color:#f0fff4"/>
    </linearGradient>
    <linearGradient id="dartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="newsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="card3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- 배경 원 장식 -->
  <circle cx="200" cy="150" r="120" fill="#fef3c7" opacity="0.3"/>
  <circle cx="1000" cy="480" r="100" fill="#dcfce7" opacity="0.4"/>

  <!-- VS 라인 -->
  <line x1="600" y1="80" x2="600" y2="530" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4"/>
  <circle cx="600" cy="310" r="36" fill="white" filter="url(#card3)"/>
  <text x="600" y="316" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#94a3b8" font-weight="700">VS</text>

  <!-- 왼쪽: 뉴스 -->
  <text x="300" y="110" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#d97706" font-weight="700">📰 뉴스 데이터</text>
  <text x="300" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#92400e">"소문"의 영역</text>

  <rect x="80" y="165" width="440" height="80" rx="14" fill="white" filter="url(#card3)"/>
  <rect x="80" y="165" width="6" height="80" rx="3" fill="#f59e0b"/>
  <text x="108" y="196" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">✅ 실시간 · 대량 수집 가능</text>
  <text x="108" y="218" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">✅ 시장 분위기·감성 파악</text>
  <text x="108" y="238" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">✅ 소형주 숨은 이슈 발굴</text>

  <rect x="80" y="265" width="440" height="80" rx="14" fill="white" filter="url(#card3)"/>
  <rect x="80" y="265" width="6" height="80" rx="3" fill="#fca5a5"/>
  <text x="108" y="296" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">⚠️ 기자 주관·과장 포함</text>
  <text x="108" y="318" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">⚠️ 찌라시·루머 섞임</text>
  <text x="108" y="338" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">⚠️ 오보 시 정정 가능</text>

  <!-- 신뢰도 바 (뉴스) -->
  <text x="300" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#92400e" font-weight="600">신뢰도</text>
  <rect x="120" y="400" width="360" height="16" rx="8" fill="#fef3c7"/>
  <rect x="120" y="400" width="216" height="16" rx="8" fill="#f59e0b"/>
  <text x="344" y="413" font-family="sans-serif" font-size="11" fill="white" font-weight="600">60%</text>

  <!-- 오른쪽: DART -->
  <text x="900" y="110" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#dc2626" font-weight="700">📋 DART 공시</text>
  <text x="900" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#991b1b">"팩트"의 영역</text>

  <rect x="680" y="165" width="440" height="80" rx="14" fill="white" filter="url(#card3)"/>
  <rect x="680" y="165" width="6" height="80" rx="3" fill="#ef4444"/>
  <text x="708" y="196" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">✅ 법적 책임 → 허위 불가</text>
  <text x="708" y="218" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">✅ 실적·수주·인수합병 원천</text>
  <text x="708" y="238" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">✅ AI 판단 정확도 극적 향상</text>

  <rect x="680" y="265" width="440" height="80" rx="14" fill="white" filter="url(#card3)"/>
  <rect x="680" y="265" width="6" height="80" rx="3" fill="#86efac"/>
  <text x="708" y="296" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">💡 뉴스 분석만 할 때보다</text>
  <text x="708" y="318" font-family="sans-serif" font-size="13" fill="#374151" font-weight="600">💡 공시 결합 시 판단 품질</text>
  <text x="708" y="338" font-family="sans-serif" font-size="14" fill="#15803d" font-weight="700">💡 차원이 다른 수준으로 ↑</text>

  <!-- 신뢰도 바 (DART) -->
  <text x="900" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b" font-weight="600">신뢰도</text>
  <rect x="720" y="400" width="360" height="16" rx="8" fill="#fee2e2"/>
  <rect x="720" y="400" width="360" height="16" rx="8" fill="#ef4444"/>
  <text x="894" y="413" font-family="sans-serif" font-size="11" fill="white" font-weight="600">100%</text>

  <!-- 결론 박스 -->
  <rect x="200" y="460" width="800" height="70" rx="16" fill="white" filter="url(#card3)"/>
  <rect x="200" y="460" width="800" height="5" rx="2" fill="#22c55e"/>
  <text x="600" y="495" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#14532d" font-weight="700">뉴스(소문) + DART(팩트) 결합 = 완성형 AI 분석 엔진</text>
  <text x="600" y="518" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">뉴스가 포착한 이슈를 DART로 교차 검증 — 허수 신호 차단</text>

  <!-- 하단 -->
  <text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1e3a5f" font-weight="700">뉴스 vs DART 공시 — 무엇이 다른가</text>
</svg>
