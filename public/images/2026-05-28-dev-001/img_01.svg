<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="420" fill="url(#bg)" rx="16"/>
  <rect width="800" height="420" fill="none" rx="16" stroke="#334155" stroke-width="1"/>

  <!-- title -->
  <text x="400" y="44" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">VISUALIZATION — 주가 데이터 소스 변천사</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#f1f5f9">yfinance → pykrx → KIS API</text>
  <text x="400" y="98" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" fill="#64748b">3세대에 걸친 주가 데이터 소스 교체 이유</text>

  <!-- divider -->
  <line x1="40" y1="116" x2="760" y2="116" stroke="#334155" stroke-width="1"/>

  <!-- ── 1세대: yfinance ── -->
  <!-- badge -->
  <rect x="50" y="136" width="56" height="56" rx="14" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="158" text-anchor="middle" font-family="monospace" font-size="11" font-weight="900" fill="#ef4444">1세대</text>
  <text x="78" y="176" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef4444">yfinance</text>
  <!-- connector line -->
  <rect x="106" y="162" width="20" height="2" fill="#334155"/>

  <!-- card -->
  <rect x="126" y="128" width="188" height="76" rx="12" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="220" y="150" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Yahoo Finance 비공식 크롤링</text>
  <text x="145" y="172" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">• 종목 코드 .KS / .KQ 구분 불안정</text>
  <text x="145" y="188" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">• 데이터 업데이트 지연, SSL 오류</text>

  <!-- status tag -->
  <rect x="145" y="200" width="62" height="18" rx="9" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="176" y="213" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ef4444">❌ 교체</text>

  <!-- arrow -->
  <text x="330" y="168" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569">→</text>

  <!-- ── 2세대: pykrx ── -->
  <rect x="350" y="136" width="56" height="56" rx="14" fill="rgba(234,179,8,0.15)" stroke="#eab308" stroke-width="2"/>
  <text x="378" y="158" text-anchor="middle" font-family="monospace" font-size="11" font-weight="900" fill="#eab308">2세대</text>
  <text x="378" y="176" text-anchor="middle" font-family="monospace" font-size="10" fill="#eab308">pykrx</text>
  <rect x="106" y="162" width="20" height="2" fill="#334155"/>
  <rect x="406" y="162" width="20" height="2" fill="#334155"/>

  <rect x="426" y="128" width="188" height="76" rx="12" fill="rgba(234,179,8,0.06)" stroke="rgba(234,179,8,0.3)" stroke-width="1"/>
  <text x="520" y="150" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde68a">KRX 공식 사이트 파싱</text>
  <text x="445" y="172" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">• 사이트 구조 변경 시 파싱 중단 위험</text>
  <text x="445" y="188" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">• Docker 의존성 복잡, 실시간 없음</text>

  <rect x="445" y="200" width="62" height="18" rx="9" fill="rgba(234,179,8,0.1)" stroke="rgba(234,179,8,0.4)" stroke-width="1"/>
  <text x="476" y="213" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#eab308">⚠️ 교체</text>

  <!-- arrow -->
  <text x="630" y="168" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569">→</text>

  <!-- ── 3세대: KIS ── -->
  <rect x="648" y="136" width="56" height="56" rx="14" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="676" y="158" text-anchor="middle" font-family="monospace" font-size="11" font-weight="900" fill="#10b981">3세대</text>
  <text x="676" y="176" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">KIS API</text>

  <!-- KIS detail box -->
  <rect x="50" y="240" width="700" height="130" rx="14" fill="rgba(16,185,129,0.05)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="400" y="264" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">✅ KIS 한국투자증권 오픈트레이딩 API — 현재 사용 중</text>

  <!-- KIS data items -->
  <rect x="70" y="278" width="148" height="72" rx="10" fill="rgba(255,255,255,0.03)" stroke="#334155" stroke-width="1"/>
  <text x="144" y="298" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">주가 데이터</text>
  <text x="144" y="316" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">현재가 · 일봉 OHLCV</text>
  <text x="144" y="332" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">PBR · PER · RSI</text>

  <rect x="230" y="278" width="148" height="72" rx="10" fill="rgba(255,255,255,0.03)" stroke="#334155" stroke-width="1"/>
  <text x="304" y="298" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">투자정보</text>
  <text x="304" y="316" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">투자의견 · 목표주가</text>
  <text x="304" y="332" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">증권사 컨센서스</text>

  <rect x="390" y="278" width="148" height="72" rx="10" fill="rgba(255,255,255,0.03)" stroke="#334155" stroke-width="1"/>
  <text x="464" y="298" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">수급 데이터</text>
  <text x="464" y="316" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">외국인 · 기관 순매수</text>
  <text x="464" y="332" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">TOP30 수급</text>

  <rect x="550" y="278" width="180" height="72" rx="10" fill="rgba(255,255,255,0.03)" stroke="#334155" stroke-width="1"/>
  <text x="640" y="298" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">비고</text>
  <text x="640" y="316" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">무료 · 초당 15건 Rate limit</text>
  <text x="640" y="332" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">주말 일부 필드 None 반환 주의</text>

  <!-- footer -->
  <text x="400" y="400" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#475569">AI 주식 시스템 3편 — 데이터소스 변천사</text>
</svg>
