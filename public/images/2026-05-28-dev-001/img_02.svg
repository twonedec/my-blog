<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)" rx="16"/>
  <rect width="800" height="480" fill="none" rx="16" stroke="#334155" stroke-width="1"/>

  <!-- title -->
  <text x="400" y="44" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">VISUALIZATION — 뉴스 소스 성능 비교</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#f1f5f9">5개 소스 수집 건수 비교</text>
  <text x="400" y="98" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" fill="#64748b">최근 14일간 실제 수집 데이터 기준</text>
  <line x1="40" y1="116" x2="760" y2="116" stroke="#334155" stroke-width="1"/>

  <!-- max = 32100 → bar max width = 580px at x=160 -->
  <!-- Google RSS: 32100 -->
  <text x="150" y="160" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">Google RSS</text>
  <rect x="160" y="140" width="580" height="28" rx="6" fill="rgba(14,165,233,0.15)"/>
  <rect x="160" y="140" width="580" height="28" rx="6" fill="url(#g1)"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <text x="748" y="160" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">32,100건</text>
  <text x="168" y="160" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">압도적 양 · 본문 평균 341자</text>

  <!-- 네이버 뉴스 API: 5984 / 32100 * 580 = 108px -->
  <text x="150" y="214" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">네이버 뉴스 API</text>
  <rect x="160" y="194" width="108" height="28" rx="6" fill="url(#g2)"/>
  <text x="748" y="214" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">5,984건</text>
  <text x="276" y="214" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#64748b">본문 127자 · 안정적</text>

  <!-- Brave Search: 2937 / 32100 * 580 = 53px -->
  <text x="150" y="268" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">Brave Search</text>
  <rect x="160" y="248" width="53" height="28" rx="6" fill="url(#g3)"/>
  <text x="748" y="268" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#fbbf24">2,937건</text>
  <text x="221" y="268" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#64748b">투자 특화 · 유료($5/월)</text>

  <!-- KIS News: 2833 / 32100 * 580 = 51px -->
  <text x="150" y="322" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">KIS News</text>
  <rect x="160" y="302" width="51" height="28" rx="6" fill="url(#g4)"/>
  <text x="748" y="322" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#a78bfa">2,833건</text>
  <text x="219" y="322" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#64748b">본문 67자 · 빈 본문 46.8% ⚠️</text>

  <!-- 네이버 금융 종목뉴스: 2304 / 32100 * 580 = 42px -->
  <text x="150" y="376" text-anchor="end" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">네이버 금융 뉴스</text>
  <rect x="160" y="356" width="42" height="28" rx="6" fill="url(#g5)"/>
  <text x="748" y="376" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#f472b6">2,304건</text>
  <text x="210" y="376" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#64748b">종목 특화 큐레이션 · 노이즈 적음</text>

  <!-- footer box -->
  <rect x="50" y="406" width="700" height="50" rx="12" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="400" y="427" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" fill="#6ee7b7">💡 건수가 많다고 좋은 게 아닙니다.</text>
  <text x="400" y="448" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="12" fill="#94a3b8">각 소스는 서로 다른 종류의 기사를 수집합니다 — 역할 분담이 핵심입니다.</text>
</svg>
