<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg4)" rx="16"/>
  <rect width="800" height="400" fill="none" rx="16" stroke="#334155" stroke-width="1"/>

  <text x="400" y="44" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="3">VISUALIZATION — 소스별 활용 가이드</text>
  <text x="400" y="74" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#f1f5f9">언제, 어떤 소스를 쓰면 좋은가</text>
  <line x1="40" y1="96" x2="760" y2="96" stroke="#334155" stroke-width="1"/>

  <!-- header row -->
  <rect x="40" y="104" width="720" height="30" rx="0" fill="rgba(255,255,255,0.04)"/>
  <text x="130" y="124" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">소스</text>
  <text x="290" y="124" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">강점</text>
  <text x="450" y="124" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">약점</text>
  <text x="640" y="124" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">추천 용도</text>

  <!-- rows -->
  <!-- Google RSS -->
  <rect x="40" y="134" width="720" height="44" rx="0" fill="rgba(14,165,233,0.04)"/>
  <rect x="40" y="134" width="4" height="44" fill="#38bdf8"/>
  <text x="130" y="152" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">Google RSS</text>
  <text x="130" y="168" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" fill="#64748b">무료</text>
  <text x="290" y="160" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">건수 많음 · 본문 풍부</text>
  <text x="450" y="160" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">노이즈 많음</text>
  <text x="640" y="160" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#6ee7b7">대형주 · 화제성 뉴스</text>

  <!-- 네이버 뉴스 API -->
  <rect x="40" y="178" width="720" height="44" rx="0" fill="rgba(16,185,129,0.04)"/>
  <rect x="40" y="178" width="4" height="44" fill="#34d399"/>
  <text x="130" y="196" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">네이버 뉴스</text>
  <text x="130" y="212" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" fill="#64748b">무료</text>
  <text x="290" y="204" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">안정적 · 키워드 검색</text>
  <text x="450" y="204" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">본문 짧음 (127자)</text>
  <text x="640" y="204" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#6ee7b7">일반 검색 보완</text>

  <!-- KIS News -->
  <rect x="40" y="222" width="720" height="44" rx="0" fill="rgba(139,92,246,0.04)"/>
  <rect x="40" y="222" width="4" height="44" fill="#a78bfa"/>
  <text x="130" y="240" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#a78bfa">KIS News</text>
  <text x="130" y="256" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" fill="#64748b">무료</text>
  <text x="290" y="248" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">공식 투자 뉴스</text>
  <text x="450" y="244" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#ef4444">본문 없음 (46.8% 공백)</text>
  <text x="450" y="260" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" fill="#64748b">재검색 매칭 53%만 성공</text>
  <text x="640" y="248" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#6ee7b7">투자 이벤트 감지</text>

  <!-- 네이버 금융 종목뉴스 -->
  <rect x="40" y="266" width="720" height="44" rx="0" fill="rgba(244,114,182,0.04)"/>
  <rect x="40" y="266" width="4" height="44" fill="#f472b6"/>
  <text x="130" y="284" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f472b6">네이버 금융</text>
  <text x="130" y="300" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" fill="#64748b">스크래핑 · 무료</text>
  <text x="290" y="292" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">종목 특화 · 노이즈 적음</text>
  <text x="450" y="292" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">HTML 파싱 의존</text>
  <text x="640" y="292" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#6ee7b7">소형주 · 관련성 중요 시</text>

  <!-- Brave Search -->
  <rect x="40" y="310" width="720" height="44" rx="0" fill="rgba(251,191,36,0.04)"/>
  <rect x="40" y="310" width="4" height="44" fill="#fbbf24"/>
  <text x="130" y="328" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#fbbf24">Brave Search</text>
  <text x="130" y="344" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="10" fill="#64748b">유료 $5/월</text>
  <text x="290" y="336" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#cbd5e1">투자 키워드 특화</text>
  <text x="450" y="336" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#94a3b8">유료 · 월 한도 있음</text>
  <text x="640" y="336" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#6ee7b7">소형주 투자 뉴스 발굴</text>

  <!-- bottom divider -->
  <line x1="40" y1="354" x2="760" y2="354" stroke="#334155" stroke-width="1"/>
  <text x="400" y="380" text-anchor="middle" font-family="'Noto Sans KR', -apple-system, sans-serif" font-size="11" fill="#475569">AI 주식 시스템 3편 — 소스별 강점이 달라 5개를 병렬 운영합니다</text>
</svg>
