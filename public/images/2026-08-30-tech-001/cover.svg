<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#1b1f27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">TECH &amp; GEAR</text>
    
    <text x="0" y="90" font-family="sans-serif" font-size="42" font-weight="300" fill="#f8fafc" letter-spacing="-1">애플TV 4K + AV 리시버 5.1채널 세팅기</text>
    <text x="0" y="135" font-family="sans-serif" font-size="22" font-weight="300" fill="#94a3b8">Multi Ch In, Dolby MAT 그리고 끊김 없는 HDMI(QMS)의 핸드셰이크 충돌 해결</text>
    
    <!-- Diagram -->
    <g transform="translate(0, 190)">
      <!-- Apple TV Box -->
      <rect x="0" y="0" width="280" height="220" rx="12" fill="#181b22" stroke="#2e3646" stroke-width="2"/>
      <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">Apple TV 4K</text>
      <text x="30" y="75" font-family="sans-serif" font-size="13" fill="#64748b">오디오 자체 디코딩</text>
      
      <rect x="30" y="100" width="220" height="40" rx="6" fill="#0f172a" stroke="#3b82f6"/>
      <text x="140" y="125" font-family="monospace" font-size="14" fill="#60a5fa" text-anchor="middle">Dolby MAT (LPCM)</text>
      <text x="30" y="165" font-family="sans-serif" font-size="12" fill="#94a3b8">비압축 PCM + Atmos 메타데이터</text>
      <text x="30" y="185" font-family="sans-serif" font-size="12" fill="#ef4444">⚠️ QMS 활성화 시 PCM 채널 고정</text>

      <!-- Arrow -->
      <g transform="translate(295, 100)">
        <line x1="0" y1="10" x2="100" y2="10" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4"/>
        <polygon points="100,5 112,10 100,15" fill="#3b82f6"/>
        <text x="55" y="-5" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">HDMI 2.1 eARC</text>
      </g>

      <!-- Receiver Box -->
      <g transform="translate(420, 0)">
        <rect x="0" y="0" width="320" height="220" rx="12" fill="#181b22" stroke="#2e3646" stroke-width="2"/>
        <text x="30" y="45" font-family="sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">AV Receiver</text>
        <text x="30" y="75" font-family="sans-serif" font-size="13" fill="#64748b">신호 수신 및 디코딩</text>
        
        <rect x="30" y="100" width="260" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
        <text x="160" y="125" font-family="monospace" font-size="14" fill="#34d399" text-anchor="middle">Dolby Surround (DSur)</text>
        <text x="30" y="165" font-family="sans-serif" font-size="12" fill="#94a3b8">✓ 5.1ch 센터 대사 정상 분리</text>
        <text x="30" y="185" font-family="sans-serif" font-size="12" fill="#94a3b8">✓ 돌비 애트모스 공간음향 활성화</text>
      </g>

      <!-- Speaker Array -->
      <g transform="translate(780, 0)">
        <rect x="0" y="0" width="260" height="220" rx="12" fill="#181b22" stroke="#2e3646" stroke-width="2"/>
        <text x="25" y="45" font-family="sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">5.1 Speaker Setup</text>
        
        <rect x="25" y="75" width="65" height="35" rx="4" fill="#1e293b"/>
        <text x="57" y="97" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">FL / FR</text>

        <rect x="97" y="75" width="65" height="35" rx="4" fill="#3b82f6"/>
        <text x="129" y="97" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Center</text>

        <rect x="170" y="75" width="65" height="35" rx="4" fill="#1e293b"/>
        <text x="202" y="97" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Sub</text>

        <rect x="60" y="120" width="65" height="35" rx="4" fill="#1e293b"/>
        <text x="92" y="142" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">SL</text>

        <rect x="135" y="120" width="65" height="35" rx="4" fill="#1e293b"/>
        <text x="167" y="142" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">SR</text>

        <text x="130" y="190" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">대사 분리 완벽 복원</text>
      </g>
    </g>
  </g>
</svg>